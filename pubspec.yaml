name: smart_farm_nigeria
description: "A Smart Farm Nigeria agritech app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  geolocator: ^14.0.3
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  tflite_flutter: ^0.12.1
  image: ^4.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
 

flutter:
  uses-material-design: true
  assets:
    - assets/models/maize/
    - assets/models/groundnut/
    - assets/icon/icon.png
    
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
